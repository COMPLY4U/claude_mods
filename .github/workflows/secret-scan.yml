name: Secret-Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo mit kompletter Historie holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Betterleaks installieren
        env:
          BETTERLEAKS_VERSION: "1.10.0"
        run: |
          curl -sSfL "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          ./betterleaks --version

      - name: Gesamte Historie scannen
        run: ./betterleaks git . --redact --verbose
